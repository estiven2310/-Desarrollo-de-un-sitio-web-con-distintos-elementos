<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    
    <h1>Formulario</h1>

    <form action="procesar.php" method="post">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="Direccion">Dirección:</label>
        <textarea id="Direccion" name="Direccion" required></textarea><br><br>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required><br><br>

        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date" id="fecha" name="fecha" required><br><br>

        <label for="ciudad">ciudad:</label>
        <select id="ciudad" name="ciudad" required>
            <option value="">Seleccionar ciudad</option>
            <option value="ciudad1">Ciudad 1</option>
            <option value="ciudad2">Ciudad 2</option>
            <option value="ciudad3">Ciudad 3</option>
        </select><br><br>

        <label for="genero">Género:</label>
        <input type="radio" id="masculino" name="genero" value="masculino" required>
        <label for="masculino">Masculino</label>

        <input type="radio" id="femenino" name="genero" value="femenino" required>
        <label for="femenino">Femenino</label><br><br>

        <label for="Pasatiempo">Pasatiempo:</label><br>
        <input type="checkbox" id="pasatiempo1" name="pasatiempos" value="pasatiempo1">
        <label for="pasatiempo1">Pasatiempo 1</label><br>
        <input type="checkbox" id="pasatiempo2" name="pasatiempos" value="pasatiempo2">
        <label for="pasatiempo2">Pasatiempo 2</label><br>
        <input type="checkbox" id="pasatiempo3" name="pasatiempos   " value="pasatiempo3">
        <label for="pasatiempo3">Pasatiempo 3</label><br><br>

        <input type="submit" value="Enviar">

    </form>

</body>
</html>
